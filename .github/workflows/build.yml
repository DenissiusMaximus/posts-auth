name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/denissiusmaximus/posts-auth:latest
            ghcr.io/denissiusmaximus/posts-auth:${{ github.sha }}
          cache-from: type=gha,scope=posts-auth
          cache-to: type=gha,mode=max,scope=posts-auth

      - name: Trigger redeploy on VM
        run: |
          curl --max-time 15 -sS -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}"